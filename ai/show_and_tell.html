<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANIIT USA — AI Show &amp; Tell</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a3a5c 0%, #0f2540 100%);
      color: white;
      padding: 1.75rem 2rem;
      border-bottom: 4px solid #f97316;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    header .logo {
      flex-shrink: 0;
    }
    header .logo img {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      display: block;
      object-fit: contain;
      background: white;
      padding: 4px;
    }
    header .header-text {
      flex: 1;
    }
    header .org-name {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #f97316;
      margin-bottom: 0.3rem;
    }
    header .breadcrumb {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 0.4rem;
    }
    header .breadcrumb a {
      color: #94a3b8;
      text-decoration: none;
    }
    header .breadcrumb a:hover { color: white; }
    header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }
    header p {
      color: #94a3b8;
      font-size: 0.95rem;
      max-width: 560px;
    }
    @media (max-width: 480px) {
      header { gap: 1rem; }
      header .logo img { width: 52px; height: 52px; }
      header h1 { font-size: 1.4rem; }
    }

    /* ── Main ── */
    main {
      max-width: 1050px;
      margin: 2.5rem auto;
      padding: 0 1.5rem 4rem;
    }

    /* ── Table wrapper ── */
    .table-wrap {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    thead tr {
      background: #1a3a5c;
      color: white;
    }
    thead th {
      padding: 0.85rem 1.1rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8faff; }

    td {
      padding: 0.85rem 1.1rem;
      vertical-align: middle;
    }

    /* Date cell */
    .td-date {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      color: #475569;
      font-size: 0.85rem;
    }
    .date-badge {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 6px;
      padding: 0.2rem 0.55rem;
      font-weight: 600;
      font-size: 0.8rem;
    }

    /* Speaker cell */
    .speaker {
      font-weight: 600;
      color: #0f2540;
    }

    /* Topic cell */
    .topic {
      color: #334155;
      line-height: 1.4;
    }
    .no-data {
      color: #cbd5e1;
      font-style: italic;
      font-size: 0.82rem;
    }

    /* Links column */
    .links-cell {
      white-space: nowrap;
    }
    .icon-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      margin-right: 0.35rem;
      border: 1.5px solid transparent;
      transition: all 0.15s;
    }
    .icon-link svg { width: 14px; height: 14px; flex-shrink: 0; }

    .link-slides {
      background: #fff7ed;
      color: #c2410c;
      border-color: #fed7aa;
    }
    .link-slides:hover { background: #f97316; color: white; border-color: #f97316; }

    .link-video {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fecaca;
    }
    .link-video:hover { background: #dc2626; color: white; border-color: #dc2626; }

    .link-demo {
      background: #f0fdf4;
      color: #15803d;
      border-color: #bbf7d0;
    }
    .link-demo:hover { background: #16a34a; color: white; border-color: #16a34a; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem;
      color: #94a3b8;
      font-size: 0.8rem;
    }
    footer a { color: #64748b; }

    @media (max-width: 680px) {
      header h1 { font-size: 1.5rem; }
      thead th, td { padding: 0.65rem 0.7rem; font-size: 0.82rem; }
      .icon-link span { display: none; }
    }
  
    /* ── Session block ── */
    .session + .session { margin-top: 2.75rem; }
    .session-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem 1rem;
      margin-bottom: 0.9rem;
    }
    .session-head h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #0f2540;
    }
    .session-time {
      font-size: 0.85rem;
      color: #475569;
    }
    .session-video { margin-top: 0.9rem; }
    .num {
      color: #94a3b8;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <img src="../assets/public/logo.jpg" alt="PANIIT USA logo" />
  </div>
  <div class="header-text">
    <div class="org-name">PANIIT USA</div>
    <div class="breadcrumb"><a href="../">← Home</a> &nbsp;/&nbsp; <a href="./">AI Talks</a></div>
    <h1>AI Show &amp; Tell</h1>
    <p>For those who want to explore the more technical aspects of AI systems — three short presentations and demos in one hour.</p>
  </div>
</header>

<main>

  <div id="sessions">
    <!-- Populated by JS below -->
  </div>

  <div style="margin-top:2rem;">
    <a href="show_and_tell_guidelines.html" style="display:inline-flex;align-items:center;gap:0.4rem;font-size:0.88rem;font-weight:600;color:#1a3a5c;text-decoration:none;border:1.5px solid #cbd5e1;border-radius:8px;padding:0.45rem 0.9rem;background:white;transition:all 0.15s;" onmouseover="this.style.borderColor='#1a3a5c';this.style.background='#f0f4f8'" onmouseout="this.style.borderColor='#cbd5e1';this.style.background='white'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;flex-shrink:0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Show &amp; Tell Guidelines
    </a>
  </div>

</main>

<footer>
  <p>PANIIT USA &nbsp;·&nbsp; <a href="https://github.com/paniit-usa" target="_blank">github.com/paniit-usa</a></p>
</footer>

<script>
  /* ── Session data ── */
  /* Newest session first. Each session has three talks.
     fullVideo: one recording of the whole session (optional).
     Per-talk slides/video: leave "" if not available.
     demo: optional link to an interactive demo. */
  const sessions = [
    {
      title: "November 2026 Show &amp; Tell",
      date: "2026-11-12",
      time: "9pm EST · 6pm PST · 7:30am IST (Nov 13)",
      fullVideo: "",
      talks: [
        { speaker: "Suresh Shenoy",  topic: "The challenge of using Gen AI for personal history research", slides: "../slides/Nov-SAT_AI Memoir Platforms and Why Remento ver 5.0 - Final.pdf", video: "" },
        { speaker: "Soumitra Ghosh", topic: "Measuring small changes to a RAG harness",                    slides: "../slides/Nov-SAT_RAG Test Harness Show and Tell.pdf", video: "" },
        { speaker: "Govind T.",      topic: "Machine reasoning and ARC AGI",                               slides: "../slides/Nov-SAT_my-arcagi-slides-Final.pdf", video: "", demo: "../slides/Nov-SAT_infer-the-rule.html" }
      ]
    }
  ];

  /* ── Helpers ── */
  function fmtDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  const slideIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`;
  const videoIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0C.488 3.45.029 5.804 0 12c.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0C23.512 20.55 23.971 18.196 24 12c-.029-6.185-.484-8.549-4.385-8.816zM9 16V8l8 4-8 4z"/></svg>`;

  const demoIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>`;

  /* ── Render ── */
  const container = document.getElementById("sessions");

  sessions.forEach(s => {
    const rows = s.talks.map((t, i) => {
      const links = [
        t.slides ? `<a class="icon-link link-slides" href="${t.slides}" target="_blank" rel="noopener">${slideIcon}<span>Slides</span></a>` : "",
        t.video  ? `<a class="icon-link link-video"  href="${t.video}"  target="_blank" rel="noopener">${videoIcon}<span>Video</span></a>`  : "",
        t.demo   ? `<a class="icon-link link-demo"   href="${t.demo}"   target="_blank" rel="noopener">${demoIcon}<span>Try it</span></a>` : ""
      ].join("");
      return `
        <tr>
          <td class="num">${i + 1}</td>
          <td><span class="speaker">${t.speaker}</span></td>
          <td class="topic">${t.topic || '<span class="no-data">TBA</span>'}</td>
          <td class="links-cell">${links || '<span class="no-data">Coming soon</span>'}</td>
        </tr>`;
    }).join("");

    const fullVideo = s.fullVideo
      ? `<div class="session-video"><a class="icon-link link-video" href="${s.fullVideo}" target="_blank" rel="noopener">${videoIcon}<span>Watch the full session</span></a></div>`
      : "";

    const section = document.createElement("section");
    section.className = "session";
    section.innerHTML = `
      <div class="session-head">
        <h2>${s.title}</h2>
        <div class="session-time"><span class="date-badge">${fmtDate(s.date)}</span> &nbsp;${s.time}</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>Speaker</th><th>Topic</th><th>Resources</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${fullVideo}`;
    container.appendChild(section);
  });
</script>

</body>
</html>
