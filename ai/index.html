<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANIIT USA — AI Talks &amp; Webinars</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a3a5c 0%, #0f2540 100%);
      color: white;
      padding: 1.75rem 2rem;
      border-bottom: 4px solid #f97316;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    header .logo {
      flex-shrink: 0;
    }
    header .logo img {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      display: block;
      object-fit: contain;
      background: white;
      padding: 4px;
    }
    header .header-text {
      flex: 1;
    }
    header .org-name {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #f97316;
      margin-bottom: 0.3rem;
    }
    header .breadcrumb {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 0.4rem;
    }
    header .breadcrumb a {
      color: #94a3b8;
      text-decoration: none;
    }
    header .breadcrumb a:hover { color: white; }
    header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }
    header p {
      color: #94a3b8;
      font-size: 0.95rem;
      max-width: 560px;
    }
    @media (max-width: 480px) {
      header { gap: 1rem; }
      header .logo img { width: 52px; height: 52px; }
      header h1 { font-size: 1.4rem; }
    }

    /* ── Main ── */
    main {
      max-width: 1050px;
      margin: 2.5rem auto;
      padding: 0 1.5rem 4rem;
    }

    /* ── Search bar ── */
    .search-wrap {
      margin-bottom: 1.5rem;
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 17px; height: 17px;
      color: #94a3b8;
      pointer-events: none;
    }
    #search {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      font-size: 0.95rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      background: white;
      color: #1e293b;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #search:focus {
      border-color: #1a3a5c;
      box-shadow: 0 0 0 3px rgba(26,58,92,0.1);
    }
    #search::placeholder { color: #94a3b8; }
    .no-results {
      text-align: center;
      padding: 2.5rem;
      color: #94a3b8;
      font-style: italic;
      display: none;
    }

    /* ── Table wrapper ── */
    .table-wrap {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    thead tr {
      background: #1a3a5c;
      color: white;
    }
    thead th {
      padding: 0.85rem 1.1rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8faff; }

    td {
      padding: 0.85rem 1.1rem;
      vertical-align: middle;
    }

    /* Date cell */
    .td-date {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      color: #475569;
      font-size: 0.85rem;
    }
    .date-badge {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 6px;
      padding: 0.2rem 0.55rem;
      font-weight: 600;
      font-size: 0.8rem;
    }

    /* Speaker cell */
    .speaker {
      font-weight: 600;
      color: #0f2540;
    }

    /* Topic cell */
    .topic {
      color: #334155;
      line-height: 1.4;
    }
    .no-data {
      color: #cbd5e1;
      font-style: italic;
      font-size: 0.82rem;
    }

    /* Links column */
    .links-cell {
      white-space: nowrap;
    }
    .icon-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      margin-right: 0.35rem;
      border: 1.5px solid transparent;
      transition: all 0.15s;
    }
    .icon-link svg { width: 14px; height: 14px; flex-shrink: 0; }

    .link-slides {
      background: #fff7ed;
      color: #c2410c;
      border-color: #fed7aa;
    }
    .link-slides:hover { background: #f97316; color: white; border-color: #f97316; }

    .link-video {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fecaca;
    }
    .link-video:hover { background: #dc2626; color: white; border-color: #dc2626; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem;
      color: #94a3b8;
      font-size: 0.8rem;
    }
    footer a { color: #64748b; }

    @media (max-width: 680px) {
      header h1 { font-size: 1.5rem; }
      thead th, td { padding: 0.65rem 0.7rem; font-size: 0.82rem; }
      .icon-link span { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <img src="../assets/public/logo.jpg" alt="PANIIT USA logo" />
  </div>
  <div class="header-text">
    <div class="org-name">PAN IIT USA</div>
    <div class="breadcrumb"><a href="../">← Home</a></div>
    <h1>AI Talks &amp; Webinars</h1>
    <p>A curated series of talks by IIT alumni — covering AI, quantum computing, and emerging technology.</p>
  </div>
</header>

<main>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search" type="search" placeholder="Search by speaker, topic, date…" autocomplete="off" />
  </div>

  <div class="table-wrap">
    <table id="talks-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Speaker</th>
          <th>Topic</th>
          <th>Resources</th>
        </tr>
      </thead>
      <tbody id="talks-body">
        <!-- Populated by JS below -->
      </tbody>
      <tfoot>
        <tr id="no-results-row" style="display:none">
          <td colspan="4" class="no-results" style="display:table-cell">No talks match your search.</td>
        </tr>
      </tfoot>
    </table>
  </div>

</main>

<footer>
  <p>PAN IIT USA &nbsp;·&nbsp; <a href="https://github.com/paniit-usa" target="_blank">github.com/paniit-usa</a></p>
</footer>

<script>
  /* ── Talk data ── */
  /* To add a new row, append an object to this array.
     Leave slides or video as "" if not available. */
  const talks = [
    {
      date: "2026-10-01",
      speaker: "Prof. Giri Narasimhan",
      topic: "The Future of Learning in the Age of AI",
      slides: "../slides/2026OCT01-Giri-PanIIT-Talk.pdf",
      video: "https://youtu.be/MHKvGOH4mQE"
    },
    {
      date: "2026-09-17",
      speaker: "Dr. Roopesh Mathur",
      topic: "From Qubits to Quantum Computing",
      slides: "../slides/PanIIT USA - Introduction to Quantum Computing -Roopesh Mathur- 09172026.pdf",
      video: "https://www.youtube.com/watch?v=C3IJcbLYPCk"
    },
    {
      date: "2026-08-28",
      speaker: "Kannan Govindarajan",
      topic: "AI in Healthcare — Hype, Hope and Evidence",
      slides: "../slides/AI_in_Healthcare_Visual_v2_uniform.pdf",
      video: "https://youtu.be/6lQDw3cJ390"
    },
    {
      date: "2026-06-25",
      speaker: "Lokesh Johri",
      topic: "Bandits to Reinforcement Learning",
      slides: "../slides/K-Armed-Bandit-Basics.pdf",
      video: ""
    },
    {
      date: "2026-06-11",
      speaker: "Himanshu Verma",
      topic: "Applied Generative AI",
      slides: "",
      video: ""
    },
    {
      date: "2026-04-27",
      speaker: "Rahul Tripathi",
      topic: "Fine-tuning Small Language Models (SLMs)",
      slides: "https://ljohri.github.io/ai-info/assets/files/fine-tuning-small-language-models.pdf",
      video: "https://youtu.be/ul9dONg-3mM"
    }
  ];

  /* ── Helpers ── */
  function fmtDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  const slideIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`;
  const videoIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0C.488 3.45.029 5.804 0 12c.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0C23.512 20.55 23.971 18.196 24 12c-.029-6.185-.484-8.549-4.385-8.816zM9 16V8l8 4-8 4z"/></svg>`;

  /* ── Render ── */
  const tbody = document.getElementById("talks-body");

  talks.forEach(t => {
    const tr = document.createElement("tr");

    const links = [
      t.slides ? `<a class="icon-link link-slides" href="${t.slides}" target="_blank" rel="noopener">${slideIcon}<span>Slides</span></a>` : "",
      t.video  ? `<a class="icon-link link-video"  href="${t.video}"  target="_blank" rel="noopener">${videoIcon}<span>Video</span></a>`  : ""
    ].join("");

    tr.innerHTML = `
      <td class="td-date"><span class="date-badge">${fmtDate(t.date)}</span></td>
      <td><span class="speaker">${t.speaker}</span></td>
      <td class="topic">${t.topic || '<span class="no-data">TBA</span>'}</td>
      <td class="links-cell">${links || '<span class="no-data">—</span>'}</td>
    `;
    tbody.appendChild(tr);
  });

  /* ── Fuzzy search ── */
  function fuzzyMatch(query, text) {
    // Returns true if all characters of query appear in order within text
    query = query.toLowerCase();
    text  = text.toLowerCase();
    let qi = 0;
    for (let i = 0; i < text.length && qi < query.length; i++) {
      if (text[i] === query[qi]) qi++;
    }
    return qi === query.length;
  }

  document.getElementById("search").addEventListener("input", function () {
    const q = this.value.trim();
    const rows = tbody.querySelectorAll("tr");
    let visible = 0;

    rows.forEach((tr, i) => {
      const t = talks[i];
      const haystack = [t.date, t.speaker, t.topic, fmtDate(t.date)].join(" ");
      const show = !q || fuzzyMatch(q, haystack);
      tr.style.display = show ? "" : "none";
      if (show) visible++;
    });

    document.getElementById("no-results-row").style.display = visible === 0 ? "" : "none";
  });
</script>

</body>
</html>
