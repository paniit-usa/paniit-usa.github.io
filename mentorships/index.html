<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANIIT USA — Mentorships</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1a3a5c 0%, #0f2540 100%);
      color: white;
      padding: 1.75rem 2rem;
      border-bottom: 4px solid #f97316;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    header .logo img {
      width: 72px; height: 72px;
      border-radius: 10px;
      object-fit: contain;
      background: white;
      padding: 4px;
      display: block;
      flex-shrink: 0;
    }
    header .org-name {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #f97316;
      margin-bottom: 0.3rem;
    }
    header .breadcrumb { font-size: 0.82rem; color: #94a3b8; margin-bottom: 0.4rem; }
    header .breadcrumb a { color: #94a3b8; text-decoration: none; }
    header .breadcrumb a:hover { color: white; }
    header h1 { font-size: 1.9rem; font-weight: 700; margin-bottom: 0.3rem; }
    header p { color: #94a3b8; font-size: 0.95rem; }

    @media (max-width: 480px) {
      header { gap: 1rem; }
      header .logo img { width: 52px; height: 52px; }
      header h1 { font-size: 1.4rem; }
    }

    /* ── Main ── */
    main {
      max-width: 900px;
      margin: 3rem auto;
      padding: 0 1.5rem 5rem;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 1.25rem;
    }

    /* ── Cards grid ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 1.75rem 1.5rem;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
      transition: box-shadow 0.18s, transform 0.18s, border-color 0.18s;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .card:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      transform: translateY(-2px);
      border-color: #1a3a5c;
    }

    .card-icon { font-size: 2rem; line-height: 1; margin-bottom: 0.25rem; }
    .card-title { font-size: 1.15rem; font-weight: 700; color: #0f2540; }
    .card-desc { font-size: 0.88rem; color: #64748b; line-height: 1.5; }
    .card-arrow {
      margin-top: auto;
      padding-top: 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #f97316;
    }

    footer { text-align: center; padding: 1.5rem; color: #94a3b8; font-size: 0.8rem; }
    footer a { color: #64748b; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <img src="../assets/public/logo.jpg" alt="PANIIT USA logo" />
  </div>
  <div class="header-text">
    <div class="org-name">PANIIT USA</div>
    <div class="breadcrumb"><a href="../">← Home</a></div>
    <h1>Mentorships</h1>
    <p>IIT alumni guiding the next generation of engineers and leaders.</p>
  </div>
</header>

<main>
  <div class="section-label">Mentorship Programs</div>

  <div class="cards">

    <a class="card" href="academic.html">
      <div class="card-icon">🎓</div>
      <div class="card-title">Academic Mentorships</div>
      <div class="card-desc">Mentoring for alumni pursuing a career in academia, from students to future deans and presidents.</div>
      <div class="card-arrow">Learn more &rarr;</div>
    </a>

  </div>
</main>

<footer>
  <p>PANIIT USA &nbsp;·&nbsp; <a href="https://github.com/paniit-usa" target="_blank">github.com/paniit-usa</a></p>
</footer>

</body>
</html>
