<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANIIT USA — Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1a3a5c 0%, #0f2540 100%);
      color: white;
      padding: 1.75rem 2rem;
      border-bottom: 4px solid #f97316;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    header .logo img {
      width: 72px; height: 72px;
      border-radius: 10px;
      object-fit: contain;
      background: white;
      padding: 4px;
      display: block;
    }
    header .org-name {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #f97316;
      margin-bottom: 0.3rem;
    }
    header .breadcrumb { font-size: 0.82rem; color: #94a3b8; margin-bottom: 0.4rem; }
    header .breadcrumb a { color: #94a3b8; text-decoration: none; }
    header .breadcrumb a:hover { color: white; }
    header h1 { font-size: 1.9rem; font-weight: 700; margin-bottom: 0.3rem; }
    header p { color: #94a3b8; font-size: 0.95rem; }
    main {
      max-width: 700px;
      margin: 4rem auto;
      padding: 0 1.5rem;
      text-align: center;
    }
    .coming-soon {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 3rem 2rem;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    }
    .coming-soon h2 { font-size: 1.5rem; color: #1a3a5c; margin-bottom: 0.75rem; }
    .coming-soon p { color: #64748b; line-height: 1.6; }
    footer { text-align: center; padding: 1.5rem; color: #94a3b8; font-size: 0.8rem; }
    footer a { color: #64748b; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <img src="../assets/public/logo.jpg" alt="PANIIT USA logo" />
  </div>
  <div class="header-text">
    <div class="org-name">PAN IIT USA</div>
    <div class="breadcrumb"><a href="../">← Home</a></div>
    <h1>Bridge</h1>
    <p>Connecting IIT alumni with opportunities and community.</p>
  </div>
</header>

<main>
  <div class="coming-soon">
    <h2>Coming Soon</h2>
    <p>The PANIIT Bridge program page is under construction. Check back soon for updates on mentorship connections, networking events, and community initiatives.</p>
  </div>
</main>

<footer>
  <p>PAN IIT USA &nbsp;·&nbsp; <a href="https://github.com/paniit-usa" target="_blank">github.com/paniit-usa</a></p>
</footer>

</body>
</html>
